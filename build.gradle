plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.terraformersmc:modmenu:17.0.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

// Dependency-free policy regression checks run as part of every build.
sourceSets {
    policyTest {
        java.srcDir 'tests'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('policyTest', JavaExec) {
    dependsOn tasks.named('policyTestClasses')
    classpath = sourceSets.policyTest.runtimeClasspath
    mainClass = 'EvidenceScoreTest'
}
tasks.named('check') { dependsOn tasks.named('policyTest') }

// Opt-in real-client visual smoke test; no test code is included in the release JAR.
if (project.hasProperty('uiSmoke')) {
    sourceSets {
        uiSmoke {
            java.srcDir 'ui-smoke/java'
            resources.srcDir 'ui-smoke/resources'
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + output
        }
    }
    loom {
        mods {
            donutsmpclient { sourceSet sourceSets.main }
            dessert_ui_smoke { sourceSet sourceSets.uiSmoke }
        }
        runs {
            client {
                programArgs '--width', '1600', '--height', '900'
            }
        }
    }
}
