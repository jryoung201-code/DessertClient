name: Build PointWalker API Add-on
on:
  push:
    branches: [feature/pointwalker-api-build]
  pull_request:
    branches: [main]
    paths: [".build-src/PointWalker-API-source.b64", ".github/workflows/pointwalker-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 1.21.11 Fabric API JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack PointWalker API source
        shell: bash
        run: |
          mkdir -p /tmp/pointwalker-builder
          base64 --decode .build-src/PointWalker-API-source.b64 > /tmp/pointwalker-builder/pwapi.zip
          unzip -q /tmp/pointwalker-builder/pwapi.zip -d /tmp/pointwalker-builder
          test -f /tmp/pointwalker-builder/PointWalker-API/build.gradle
      - name: Compile and remap Fabric JAR
        working-directory: /tmp/pointwalker-builder/PointWalker-API
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: PointWalker-API-1.2.0-MC1.21.11
          path: /tmp/pointwalker-builder/PointWalker-API/build/libs/PointWalker-API-1.2.0.jar
          if-no-files-found: error
          retention-days: 14
