name: Build Ore Tunnel Miner
on:
  push:
    branches:
      - feature/ore-tunnel-miner-v1-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Unpack OreTunnelMiner and PointWalker source
        run: |
          base64 -d ore-tunnel-miner-source.b64 > /tmp/ore-tunnel-miner-source.tar.xz
          tar -xJf /tmp/ore-tunnel-miner-source.tar.xz
      - name: Build PointWalker API prerequisite
        working-directory: ore-tunnel-miner/PointWalker
        run: gradle --no-daemon clean build
      - name: Build OreTunnelMiner
        working-directory: ore-tunnel-miner/OreTunnelMiner
        run: gradle --no-daemon clean build
      - name: Verify distinct Fabric mod IDs and dependency
        run: |
          python3 - <<'PY'
          import zipfile, json, pathlib
          targets = [
            ('ore-tunnel-miner/PointWalker/build/libs/PointWalker-1.3.0.jar', 'pointwalker'),
            ('ore-tunnel-miner/OreTunnelMiner/build/libs/OreTunnelMiner-1.0.0.jar', 'oretunnelminer')
          ]
          for path, expected_id in targets:
            with zipfile.ZipFile(path) as jar:
              meta = json.loads(jar.read('fabric.mod.json'))
              assert meta['id'] == expected_id, (path,meta['id'])
              assert 'dev/aven/' in '\n'.join(jar.namelist())
              if expected_id == 'oretunnelminer':
                assert meta['depends'].get('pointwalker') == '>=1.3.0'
            print(path, expected_id, pathlib.Path(path).stat().st_size)
          PY
      - name: Upload installable OreTunnelMiner JAR
        uses: actions/upload-artifact@v4
        with:
          name: OreTunnelMiner-1.0.0-MC1.21.11
          path: ore-tunnel-miner/OreTunnelMiner/build/libs/OreTunnelMiner-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
