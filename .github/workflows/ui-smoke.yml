name: UI smoke test
on:
  push:
    branches: [dessert-overhaul]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Prepare virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libflite1
      - name: Launch Minecraft and capture the actual UI
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: timeout 480s xvfb-run -a -s '-screen 0 1920x1080x24' gradle --no-daemon -PuiSmoke runClient
      - name: Upload screenshot and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dessert-ui-smoke
          path: |
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports
          if-no-files-found: warn
