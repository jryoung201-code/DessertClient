name: Build DonutSMP Client

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Minecraft 1.21.11 mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutSMP-Client-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish JAR to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DonutSMP Client Build #${{ github.run_number }}
          body: |
            Automated build of DonutSMP Client for Minecraft Java 1.21.11.
            Requires Fabric Loader and Fabric API.
          files: build/libs/*.jar
          fail_on_unmatched_files: true
          make_latest: true
